resources:
  jobs:
    # Polls the live station feeds. Each run is a few seconds of serverless compute.
    gbfs_collection:
      name: gbfs_collection
      description: Collects one snapshot of each GBFS station feed into the landing volume.
      max_concurrent_runs: 1
      timeout_seconds: 600
      schedule:
        quartz_cron_expression: "0 0/${var.gbfs_poll_minutes} * * * ?"
        timezone_id: ${var.timezone}
        pause_status: ${var.gbfs_schedule_status}
      email_notifications:
        on_failure:
          - ${var.alert_email}
        no_alert_for_skipped_runs: true
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: collect_gbfs
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 30000
          python_wheel_task:
            package_name: bikeshare_lakehouse
            entry_point: collect-gbfs
            parameters:
              - --discovery-url
              - ${var.gbfs_discovery_url}
              - --feeds
              - ${var.gbfs_feeds}
              - --volume-path
              - ${var.landing_volume_path}

    # Downloads any missing trip months, refreshes the pipeline, then checks the result.
    lakehouse_pipeline:
      name: lakehouse_pipeline
      description: Downloads trip files, refreshes bronze, silver and gold, and runs cross-table quality checks.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: ${var.timezone}
        pause_status: ${var.pipeline_schedule_status}
      email_notifications:
        on_failure:
          - ${var.alert_email}
      parameters:
        - name: trip_months
          default: ${var.trip_months}
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: download_trips
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: bikeshare_lakehouse
            entry_point: download-trips
            parameters:
              - --months
              - "{{job.parameters.trip_months}}"
              - --base-url
              - ${var.trip_base_url}
              - --volume-path
              - ${var.landing_volume_path}

        # silver.trips declares a column mask, so the mask function must exist
        # before the pipeline refreshes.
        - task_key: create_governance_functions
          environment_key: default
          python_wheel_task:
            package_name: bikeshare_lakehouse
            entry_point: create-governance-functions
            parameters:
              - --catalog
              - ${var.catalog}
              - --engineers-group
              - ${var.engineers_group}

        - task_key: refresh_pipeline
          depends_on:
            - task_key: download_trips
            - task_key: create_governance_functions
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakehouse.id}

        - task_key: quality_checks
          depends_on:
            - task_key: refresh_pipeline
          environment_key: default
          python_wheel_task:
            package_name: bikeshare_lakehouse
            entry_point: run-quality-checks
            parameters:
              - --catalog
              - ${var.catalog}
