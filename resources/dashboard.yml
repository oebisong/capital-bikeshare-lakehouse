resources:
  sql_warehouses:
    bikeshare:
      name: bikeshare-lakehouse
      warehouse_type: PRO
      enable_serverless_compute: true
      cluster_size: 2X-Small
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 5

  dashboards:
    bikeshare:
      display_name: Capital Bikeshare Lakehouse
      file_path: ../dashboards/bikeshare_lakehouse.lvdash.json
      warehouse_id: ${resources.sql_warehouses.bikeshare.id}
      # Dataset queries use unqualified table names and resolve here.
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
      embed_credentials: false
